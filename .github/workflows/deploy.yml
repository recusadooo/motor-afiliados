name: Deploy para o VPS

# A cada push na main (ou acionando manualmente), envia o código pro VPS e
# sobe os containers. Os segredos ficam no GitHub (Settings > Secrets), nunca no chat.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar código + subir containers
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DIR: ${{ secrets.PROJECT_DIR }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          DIR="${DIR:-/opt/motor-afiliados}"
          # rsync do código: --delete limpa arquivos removidos; preserva o .env do servidor.
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'node_modules' --exclude 'dist' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            ./ "$USER@$HOST:$DIR/"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" \
            "cd $DIR && docker compose up -d --build && docker compose ps"
