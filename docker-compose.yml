# Motor de Afiliados — Docker SWARM (deploy via Portainer swarm stack).
# Imagem pré-buildada no ghcr.io (Swarm não faz build). Variáveis vão na aba do
# stack no Portainer. O schema do banco é aplicado pelo app no boot (migrate).
# Traefik roteia API_DOMAIN -> api:3000 via deploy.labels.
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: motor
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      internal:
        # Nome único no swarm. A api está TAMBÉM na TrakAdsNet, onde já existe um
        # serviço chamado "postgres" (do n8n/Evolution) — o nome curto é ambíguo
        # e a api chegou a conectar no banco errado ("password authentication
        # failed for user motor"). O alias resolve de forma inequívoca.
        aliases: [motor-postgres]
    deploy:
      restart_policy: { condition: any }
      placement:
        constraints: [node.role == manager] # fixa o banco num nó (dado estável)

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      internal:
        aliases: [motor-redis]  # mesmo motivo do postgres
    deploy:
      restart_policy: { condition: any }
      placement:
        constraints: [node.role == manager]

  api:
    image: ghcr.io/recusadooo/motor-afiliados:latest
    command: ["node", "dist/api.js"]
    environment:
      NODE_ENV: production
      # Senha vai CRUA (não dentro de URI): o app monta a URL com
      # percent-encoding, então senha com @ : / # $ ou espaço funciona.
      POSTGRES_HOST: motor-postgres
      POSTGRES_USER: motor
      POSTGRES_DB: motor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://motor-redis:6379
      SHOPEE_APP_ID: ${SHOPEE_APP_ID}
      SHOPEE_APP_SECRET: ${SHOPEE_APP_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Senha do painel — OPCIONAL. Vazio = painel aberto (escolha do dono).
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # Inteligência de mercado. Vazio = default do código (o config trata
      # ausente == vazio de propósito: o Swarm injeta '' quando você não
      # preenche no Portainer, e sem isso um campo em branco atropelaria o
      # default sem erro visível).
      INTEL_ENABLED: ${INTEL_ENABLED:-}
      INTEL_SWEEP_CRON: ${INTEL_SWEEP_CRON:-}
      INTEL_MATCH_MIN_SIM: ${INTEL_MATCH_MIN_SIM:-}
      # Validade da oferta na fila — é o que impede o impasse "sem canal =
      # captura parada para sempre". Não zere sem ler o PERGUNTAS.md.
      OFFER_MAX_AGE_HOURS: ${OFFER_MAX_AGE_HOURS:-}
    networks: [internal, TrakAdsNet]
    deploy:
      restart_policy: { condition: any }
      labels:
        - "traefik.enable=true"
        # v3 Swarm usa traefik.swarm.network (docker.network foi deprecado em 3.2.2).
        # Se seu Traefik for < 3.2.2, troque por traefik.docker.network.
        - "traefik.swarm.network=TrakAdsNet"
        - "traefik.http.routers.motor.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.routers.motor.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.motor.tls=true"
        - "traefik.http.routers.motor.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}"
        - "traefik.http.services.motor.loadbalancer.server.port=3000"

  worker:
    image: ghcr.io/recusadooo/motor-afiliados:latest
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      # Senha vai CRUA (não dentro de URI): o app monta a URL com
      # percent-encoding, então senha com @ : / # $ ou espaço funciona.
      POSTGRES_HOST: motor-postgres
      POSTGRES_USER: motor
      POSTGRES_DB: motor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://motor-redis:6379
      SHOPEE_APP_ID: ${SHOPEE_APP_ID}
      SHOPEE_APP_SECRET: ${SHOPEE_APP_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # O worker é quem roda a varredura e a correlação por cron.
      INTEL_ENABLED: ${INTEL_ENABLED:-}
      INTEL_SWEEP_CRON: ${INTEL_SWEEP_CRON:-}
      INTEL_SWEEP_LIMIT: ${INTEL_SWEEP_LIMIT:-}
      INTEL_RETENTION_DAYS: ${INTEL_RETENTION_DAYS:-}
      INTEL_MATCH_MIN_SIM: ${INTEL_MATCH_MIN_SIM:-}
      OFFER_MAX_AGE_HOURS: ${OFFER_MAX_AGE_HOURS:-}
    networks: [internal]
    deploy:
      restart_policy: { condition: any }

networks:
  internal:
    driver: overlay
  TrakAdsNet:
    external: true

volumes:
  pgdata:
  redisdata:
